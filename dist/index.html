<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Candlelight Bowl</title>

<body>
<div id="intro" hidden>
  <div><p>An interactive still life</p><h1>Candlelight Bowl</h1></div>
</div>
<main aria-label="Candlelight Bowl">
  <div id="scene" role="img" aria-label="An overhead brass bowl with seven floating candles and flowers on charcoal stone">
    <img id="plate" alt="" width="1536" height="1536" fetchpriority="high"
      src="./plate-dark-1536.jpg" srcset="./plate-dark-1536.jpg 1536w, ./plate-dark-4096.jpg 4096w"
      sizes="min(calc(100vw - 2rem), max(16rem, calc(100svh - 7rem)), 120rem)">

  <footer><p class="water-hint">Glide gently across the water</p><button id="motion" type="button" disabled>Pause motion</button></footer>
</main>
